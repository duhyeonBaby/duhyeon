<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYUNJUN PARTY</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur-amount: 15px;
            --crystal-color-1: #a8edea;
            --crystal-color-2: #fed6e3;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            /* Deep, rich moving gradient background to enhance glass effect */
            background: linear-gradient(45deg, #020024, #090979, #00d4ff, #7a00cc);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: white;
            overflow-x: hidden; /* Prevent scrollbars from effects */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Highly Transparent Glass Nav Bar --- */
        .nav-bar {
            display: flex;
            justify-content: center;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            /* Glassmorphism properties */
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-bar a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-bar a:hover, .nav-bar a.active {
            color: white;
            background: rgba(255,255,255,0.1);
            border-color: var(--glass-border);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* --- Main Content Area --- */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Subtle glass container for the center element */
            background: rgba(0,0,0,0.2);
             backdrop-filter: blur(5px);
        }

        /* --- The Interactive Crystal --- */
        .crystal-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .crystal-container:hover {
            transform: scale(1.05) rotate(5deg);
        }
        
        /* The Crystal visuals constructed via CSS */
        .crystal-wrapper {
             position: relative;
             width: 100%;
             height: 100%;
             animation: float 4s ease-in-out infinite;
        }

        .crystal-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            /* Creating a diamond shape */
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            background: linear-gradient(135deg, var(--crystal-color-1), var(--crystal-color-2));
            transform: translate(-50%, -50%);
            opacity: 0.8;
            box-shadow: 0 0 30px rgba(168, 237, 234, 0.6), inset 0 0 20px rgba(255,255,255,0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.5s ease;
        }
        
        /* Adding facets to look more 3D */
        .crystal-shape::before {
             content: '';
             position: absolute;
             top: 10px; left: 25%;
             width: 50%; height: 50%;
             background: rgba(255,255,255,0.4);
             clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        }
        
        /* Text hint below crystal */
        .click-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* --- The Explosion & Party State --- */
        
        /* Hide crystal when popped */
        .crystal-container.popped .crystal-wrapper {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        /* The Party Text */
        .party-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-family: 'Montserrat', sans-serif;
            font-size: 4em;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(to right, #fff, #a8edea, #fed6e3, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy transition */
            z-index: 20;
            white-space: nowrap;
        }

        .party-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        /* --- Mirror Ball Effect Particles --- */
        #disco-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .disco-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 10px white, 0 0 20px var(--crystal-color-1);
        }
        
        /* Animation for the particles flying around */
        @keyframes discoMove {
            0% { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(var(--move-y)) translateX(var(--move-x)) scale(1.2) rotate(180deg); }
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8em;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            border-top: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.5);
        }

        @media (max-width: 600px) {
            .party-message { font-size: 2.5em; }
            .crystal-container { width: 150px; height: 150px; }
            .crystal-shape { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html">HOME</a>
        <a href="DUHYEONbaby.html">DUHYEON</a>
        <a href="MINJAE.html">MINJAE</a>
        <a href="YUNJUN.html">YUNJUN</a>
        <a href="HYUNJUN.html" class="active">HYUNJUN</a>
    </div>

    <div id="disco-container"></div>

    <div class="content">
        <div class="crystal-container" id="crystal" onclick="popCrystal()">
            <div class="crystal-wrapper">
                <div class="crystal-shape"></div>
            </div>
            <div class="click-hint" id="hint-text">CLICK TO IGNITE</div>
        </div>

        <div class="party-message" id="party-text">
            DUHYEON PARTY
        </div>
    </div>

    <footer>
        © 2024 Duhyeon Company | Glass Series
    </footer>

    <script>
        function popCrystal() {
            const crystal = document.getElementById('crystal');
            const partyText = document.getElementById('party-text');
            const hintText = document.getElementById('hint-text');
            
            // 1. Trigger crystal explosion state
            crystal.classList.add('popped');
            hintText.style.opacity = '0';

            // 2. Show the party message after a brief delay for the pop animation
            setTimeout(() => {
                partyText.classList.add('show');
                // 3. Start mirror ball effect
                startDiscoEffect();
            }, 300);
        }

        function startDiscoEffect() {
            const container = document.getElementById('disco-container');
            const particleCount = 80; // Number of sparkles

            // Create particles
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'disco-particle';
                
                // Random properties for chaotic disco effect
                const size = Math.random() * 8 + 2 + 'px';
                const posX = Math.random() * 100 + '%';
                const posY = Math.random() * 100 + '%';
                const delay = Math.random() * 2 + 's';
                const duration = Math.random() * 3 + 2 + 's';
                // Random movement directions
                const moveX = (Math.random() * 200 - 100) + 'px';
                const moveY = (Math.random() * 200 - 100) + 'px';
                
                // Assign styles dynamically
                particle.style.width = size;
                particle.style.height = size;
                particle.style.left = posX;
                particle.style.top = posY;
                particle.style.setProperty('--move-x', moveX);
                particle.style.setProperty('--move-y', moveY);
                particle.style.animation = `discoMove ${duration} linear ${delay} infinite`;
                
                // Optional: varied colors
                if (Math.random() > 0.7) {
                    particle.style.background = '#a8edea'; // Cyan tint
                    particle.style.boxShadow = '0 0 15px #a8edea';
                } else if (Math.random() > 0.85) {
                     particle.style.background = '#fed6e3'; // Pink tint
                     particle.style.boxShadow = '0 0 15px #fed6e3';
                }

                container.appendChild(particle);
            }
        }
    </script>
</body>
</html>
